name: Stock paper bot

on:
  schedule:
    - cron: "4 * * * *"   # hourly backup trigger in case the self-scheduling loop below ever stops
  workflow_dispatch: {}               # "Run workflow" button; also how each run starts the next one
  push:
    branches: [main]
    paths: [".github/workflows/stock-bot.yml"]   # restart the loop when this file changes

permissions:
  contents: write
  actions: write     # lets a run start the next run (self-scheduling loop)

concurrency:
  group: stock-paper-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80   # must be longer than the sleep below (55 min off-hours)
    env:
      PAPERBOT_DATA: ${{ github.workspace }}/docs
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Run the 3 stock strategies (PAPER ONLY, no orders)
        run: python bot/stock_bot.py
      - name: Save state and pages
        run: |
          git config user.name "stock-paper-bot"
          git config user.email "stock-paper-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "stock bot update $(date +'%Y-%m-%d %H:%M ET')" -q
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Start the next run (every ~15 min on weekdays 9 AM-6 PM ET, hourly otherwise)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(date +%H); D=$(date +%u)
          if [ "$D" -le 5 ] && [ "$H" -ge 9 ] && [ "$H" -lt 18 ]; then S=840; else S=3300; fi
          echo "sleeping $S seconds"; sleep $S
          gh workflow run stock-bot.yml --ref main -R "${{ github.repository }}"
